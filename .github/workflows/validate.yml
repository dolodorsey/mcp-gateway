name: Validate Gmail MCP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/multi-gmail-oauth]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate source
        run: npm run check
